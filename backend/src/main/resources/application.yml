spring:
  application:
    name: cnip-network-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

nms:
  jwt:
    secret: ${JWT_SECRET:Y25pcC1kZW1vLWtleS1wbGVhc2UtcmVwbGFjZS1mb3ItcHJvZHVjdGlvbi0xMjM0NTY=}
    expiration-ms: 86400000 # 24 hours
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    polling-interval-ms: ${SIMULATOR_POLLING_INTERVAL_MS:10000}
    retention-days: ${METRICS_RETENTION_DAYS:7}
    site-count: 3
    device-count: 40

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
