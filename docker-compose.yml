version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnip_nms}
      POSTGRES_USER: ${POSTGRES_USER:-cnip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CnipSecretPass123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cnip_admin} -d ${POSTGRES_DB:-cnip_nms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnip-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cnip_nms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cnip_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-CnipSecretPass123!}
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2NuaXBfbm1zX2p3dF9zZWNyZXRfa2V5XzIwMjZfZW50ZXJwcmlzZQ==}
      NMS_SIMULATOR_ENABLED: "true"
      NMS_SIMULATOR_POLLING_INTERVAL_MS: "10000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnip-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: cnip_postgres_data
