<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — MeetWise AI Planner</title>
  <link rel="stylesheet" href="/static/css/landing.css">
  <script src="/static/js/liquid.js" defer></script>
</head>
<body>
  <!-- Full-screen WebGL Liquid Canvas Background -->
  <canvas id="liquid-canvas" data-mode="full" aria-hidden="true"></canvas>

  <div class="landing-wrapper">
    <!-- Top Navigation Bar -->
    <header class="landing-nav">
      <a class="brand-link" href="/">
        <div class="brand-badge">⚡</div>
        <span>MeetWise</span>
        <span class="brand-tag">AI Planner</span>
      </a>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme">
          <span id="theme-icon">☀️</span>
          <span id="theme-text">Light</span>
        </button>
        <a class="btn btn-ghost btn-sm" href="/">← Home</a>
        <a class="btn btn-secondary btn-sm" href="/login">Log In</a>
      </div>
    </header>

    <!-- Centered Glassmorphic Auth Form -->
    <main class="auth-page-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create Your Account</h2>
          <p>Get started with AI-driven conflict-free scheduling</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="auth-alert" role="alert"></div>

        <form id="signup-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              id="name"
              type="text"
              class="auth-input"
              placeholder="e.g. Alex Morgan"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email">Work Email</label>
            <input
              id="email"
              type="email"
              class="auth-input"
              placeholder="alex@company.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">Password (Minimum 8 Characters)</label>
            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                class="auth-input"
                placeholder="At least 8 characters"
                required
                autocomplete="new-password"
                minlength="8"
              >
              <button
                type="button"
                id="toggle-password"
                class="password-toggle-btn"
                aria-label="Toggle password visibility"
              >
                👁️
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="role">Account Role</label>
            <select id="role" class="auth-select">
              <option value="member" selected>Member (Standard user)</option>
              <option value="admin">Admin (Manage team users & system)</option>
            </select>
          </div>

          <button id="submit-btn" type="submit" class="btn btn-primary btn-full">
            <span id="btn-text">Create Account</span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login">Sign in here</a>
        </div>
      </div>
    </main>

    <footer class="landing-footer">
      MeetWise · AI-Powered Intelligent Meeting Planner
    </footer>
  </div>

  <script>
    // Theme setup
    (function () {
      const themeBtn = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");
      const themeText = document.getElementById("theme-text");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("meetwise_theme", theme);
        if (theme === "light") {
          themeIcon.textContent = "🌙";
          themeText.textContent = "Dark";
        } else {
          themeIcon.textContent = "☀️";
          themeText.textContent = "Light";
        }
      }

      const savedTheme = localStorage.getItem("meetwise_theme") ||
        (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      applyTheme(savedTheme);

      if (themeBtn) {
        themeBtn.addEventListener("click", () => {
          const current = document.documentElement.getAttribute("data-theme") || "dark";
          applyTheme(current === "dark" ? "light" : "dark");
        });
      }

      // Check if already authenticated -> go to dashboard
      fetch("/auth/me")
        .then((res) => {
          if (res.ok) {
            window.location.replace("/dashboard");
          }
        })
        .catch(() => {});
    })();

    // Password Visibility Toggle
    const passInput = document.getElementById("password");
    const togglePassBtn = document.getElementById("toggle-password");
    togglePassBtn.addEventListener("click", () => {
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      togglePassBtn.textContent = isPass ? "🙈" : "👁️";
    });

    // Form Submission
    const form = document.getElementById("signup-form");
    const alertBox = document.getElementById("auth-alert");
    const submitBtn = document.getElementById("submit-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert ${isError ? "error" : "success"}`;
      alertBox.style.display = "flex";
    }

    function hideAlert() {
      alertBox.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      if (!name) {
        showAlert("Please enter your name.");
        return;
      }
      if (!email) {
        showAlert("Please enter a valid email address.");
        return;
      }
      if (password.length < 8) {
        showAlert("Password must be at least 8 characters long.");
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = "none";
      btnSpinner.style.display = "inline-block";

      try {
        const response = await fetch("/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json",
          },
          body: JSON.stringify({ name, email, password, role }),
        });

        const data = await response.json();

        if (!response.ok) {
          const detail = data && data.detail ? data.detail : "Account creation failed.";
          const msg = Array.isArray(detail) ? detail.map((d) => d.msg).join(", ") : String(detail);
          showAlert(msg, true);
          submitBtn.disabled = false;
          btnText.style.display = "inline";
          btnSpinner.style.display = "none";
          return;
        }

        showAlert(`Account created successfully! Welcome, ${data.name}! Redirecting…`, false);
        setTimeout(() => {
          window.location.replace("/dashboard");
        }, 700);
      } catch (err) {
        showAlert("Network error connecting to MeetWise server. Please try again.", true);
        submitBtn.disabled = false;
        btnText.style.display = "inline";
        btnSpinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
